<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>썸샤이닝 반짝템</title>
<meta name="robots" content="noindex">
<style>
:root{--sun:#FFC83D;--cream:#FFF8E7;--ink:#2A2419;--soft:#6B6257;--gray:#7A8794}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif;background:var(--cream);color:var(--ink);
     word-break:keep-all;-webkit-font-smoothing:antialiased}
.disc{background:var(--ink);color:var(--cream);font-size:13px;line-height:1.5;padding:12px 20px}
header{padding:36px 20px 20px;max-width:560px;margin:0 auto}
header h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
header p{margin-top:8px;color:var(--soft);font-size:15px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:0 20px 60px}
section{padding:24px 0;border-top:1px solid #E9DFC6}
section:target{background:#FFF1C9;margin:0 -20px;padding:24px 20px}
.no{font-size:14px;font-weight:700;color:var(--gray)}
h2{margin:4px 0 14px;font-size:20px;font-weight:800;line-height:1.35}
a.item{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:var(--ink);
       background:#fff;border:1px solid #EFE4C8;border-radius:12px;padding:14px 16px;margin-bottom:8px;font-size:16px;line-height:1.4}
a.item:active{background:var(--sun)}
a.item span.go{flex:none;font-size:13px;font-weight:700;color:var(--soft)}
a.item:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.empty{padding:40px 0;color:var(--soft);font-size:16px}
footer{max-width:560px;margin:0 auto;padding:0 20px 40px;color:var(--soft);font-size:13px}
</style></head><body>
<div class="disc">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>
<header><h1>썸샤이닝 반짝템</h1><p>게시물 마지막 장의 번호를 찾아 눌러 주세요.<br>흐린 생활을 조금 반짝이게 바꿔줄 물건들이에요.</p></header>
<main><p class="empty">첫 반짝템을 준비하고 있어요. 곧 올라와요 ☀️</p></main>
<footer>@sum.shining</footer>
</body></html>
